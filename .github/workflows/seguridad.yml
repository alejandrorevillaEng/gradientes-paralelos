# Seguridad: secretos (todo el historial), análisis estático y dependencias vulnerables.
# Se ejecuta en cada PR y cada lunes, porque salen CVE nuevas aunque el código no cambie.
name: Seguridad

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secretos:
    name: Secretos (gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sast:
    name: Análisis estático (semgrep)
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'
    container: semgrep/semgrep:1.182.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: semgrep
        run: semgrep scan --config p/default --config p/c --error --metrics=off

  dependencias:
    name: Dependencias (osv-scanner)
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
    with:
      upload-sarif: true
