name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpu:
    name: Secuencial y OpenMP (${{ matrix.cc }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: OpenMP para clang
        if: matrix.cc == 'clang'
        run: sudo apt-get update && sudo apt-get install -y libomp-dev
      - name: Compilar (avisos como errores)
        env:
          CC: ${{ matrix.cc }}
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCON_CUDA=OFF -DCMAKE_C_FLAGS="-Werror"
          cmake --build build -j
      - name: Tests
        run: ctest --test-dir build --output-on-failure

  sanitizers:
    name: AddressSanitizer y UBSan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Compilar y probar con sanitizers
        run: |
          cmake --preset sanitizers
          cmake --build --preset sanitizers -j
          ctest --preset sanitizers

  analisis:
    name: Análisis estático (cppcheck)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sudo apt-get update && sudo apt-get install -y cppcheck
      - name: cppcheck
        run: cppcheck --enable=warning,performance,portability --std=c11 --inline-suppr --error-exitcode=1 -q -I include src tests

  cobertura:
    name: Cobertura (mínimo 85 % de líneas)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sudo apt-get update && sudo apt-get install -y gcovr
      - name: Tests con gcov
        run: |
          cmake --preset cobertura
          cmake --build --preset cobertura -j
          ctest --preset cobertura
      - name: Informe y umbral
        run: |
          mkdir -p cobertura
          gcovr -r . build/cobertura --filter src/ --print-summary --fail-under-line 85                 --html-details cobertura/index.html
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: cobertura
          path: cobertura/

  docker:
    name: Imagen Docker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Construir y ejecutar una medida corta
        run: |
          docker build -t gradientes .
          docker run --rm gradientes --vars 100 --terms 1000 --reps 1 --hilos 1,2 --experimento escalado

  cuda:
    name: Compilación CUDA (sin GPU)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Jimver/cuda-toolkit@b8bf9c6c28f8a92fbb04dcfcaee872e60c57462d # v0.2.36
        with:
          cuda: "12.6.3"
          method: network
          sub-packages: '["nvcc", "cudart"]'
      - name: Compilar gradbench_cuda
        # Los runners de GitHub no tienen GPU: aquí solo se comprueba que compila.
        # Los tiempos se miden con notebooks/benchmark_cuda_colab.ipynb.
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_CUDA_ARCHITECTURES=75
          cmake --build build -j --target gradbench_cuda

  graficas:
    name: Gráficas a partir de los CSV
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: pip install -r bench/requirements.txt
      - run: python bench/graficas.py --cpu resultados/cpu_ryzen7700x.csv --gpu resultados/gpu_rtx5070.csv --salida /tmp/graficas
      - run: python bench/pagina.py --cpu resultados/cpu_ryzen7700x.csv --gpu resultados/gpu_rtx5070.csv --salida /tmp/datos.js
